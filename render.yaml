services:
  - type: web
    name: breast-screening-assistant
    env: python
    plan: free
    region: oregon
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: PORT
        value: "10000"
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
      - key: RENDER_FAST_MODE
        value: "true"
    healthCheckPath: /
    preStartCommand: |
      echo "Note: Free tier has limited CPU. First prediction may take 30-60 seconds."
