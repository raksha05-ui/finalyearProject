services:
  - type: web
    name: breast-screening-assistant
    env: python
    plan: free
    region: oregon
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: PORT
        value: "10000"
    healthCheckPath: /
